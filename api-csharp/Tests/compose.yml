services:
  postgres-tests:
    image: postgres:16
    environment:
      POSTGRES_USER: cargohub_ci
      POSTGRES_PASSWORD: local_test_password
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:55439:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cargohub_ci -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 15
