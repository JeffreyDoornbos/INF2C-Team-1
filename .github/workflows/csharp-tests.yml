name: C# build and tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test with PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cargohub_ci
          POSTGRES_PASSWORD: ci_temporary_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cargohub_ci -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # This database exists only for this job; no deployment credentials are used.
      CARGOHUB_TEST_ADMIN_CONNECTION: Host=localhost;Port=5432;Database=postgres;Username=cargohub_ci;Password=ci_temporary_password
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore CargoHub.sln
      - name: Build
        run: dotnet build CargoHub.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test CargoHub.sln --configuration Release --no-build --logger trx --results-directory TestResults
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: csharp-test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn
