server {
    listen 443 ssl;
    server_name 145.24.237.22;
    ssl_certificate /etc/letsencrypt/live/145.24.237.22/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/145.24.237.22/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 5m;
    underscores_in_headers on;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";

    location = /beheer { return 302 /beheer/; }
    location /beheer/ {
        client_max_body_size 8k;
        proxy_read_timeout 55s;
        proxy_pass http://__DASHBOARD_IP__:8765;
    }
    location / {
        proxy_pass http://127.0.0.1:80;
    }
}
